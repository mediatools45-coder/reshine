<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Restoration Workshop</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body class="shop">
<canvas id="cv"></canvas>
<div id="markers"></div>
<div class="hand" id="hand"><div class="rp"></div><div class="dot"></div><svg class="fin" viewBox="0 0 46 56"><path d="M15 6c0-3 2-5 4.5-5S24 3 24 6v17l3-1c3-1 5 1 5 3l5-.5c2.5-.3 4.5 1.4 4.5 3.6l.5 1c2 .5 3 2 3 4l-1.5 11c-.6 4.8-4 8.4-9 8.4H25c-4 0-7-2-9-5L8 34c-1.3-2-.8-4.2 1-5.3 1.8-1 3.8-.6 5 .8l1 1.3z" fill="#fff6e4" stroke="#2b1b0a" stroke-width="2.2" stroke-linejoin="round"/></svg></div>

<div id="cmp" class="hide"><div id="cmpLine"></div><div id="cmpGrab"><div id="cmpKnob"><svg viewBox="0 0 24 24" fill="none" stroke="#f6efe2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg></div></div><div class="cmpLab" id="cmpL" style="left:14px">BEFORE</div><div class="cmpLab" id="cmpR" style="right:14px">AFTER</div></div>

<div class="hud" id="top">
  <div class="row">
    <div id="stepBox"><div id="lvl">Level</div><div id="stepName">&nbsp;</div></div>
  </div>
  <div id="chips"></div>
</div>
<div class="hud" id="side">
  <button class="rbtn" id="btnTurn" aria-label="Turn over"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 10-2.6 5.9"/><path d="M21 4v7h-7"/></svg><small>Turn</small></button>
  <button class="rbtn" id="btnView" aria-label="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><small>Reset</small></button>
  <button class="rbtn" id="btnHelp" aria-label="How to"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 115 .5c0 1.8-2.5 2-2.5 4M12 17.2v.1"/></svg><small>Help</small></button>
</div>
<div class="hud" id="bottom">
  <div id="meter" class="hide"><span id="mLab"></span><div class="mtrack"><i id="mZone"></i><b id="mNeedle"></b></div></div>
  <div id="hint"></div>
  <div id="bar">
    <button class="pill iconbtn" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="pill" id="tool"><div id="toolIco"></div><div id="toolTxt"><div id="toolName"></div><span id="gest"></span></div></div>
    <button class="big hide" id="btnHold">HOLD</button>
    <button class="big go hide" id="btnFinish">Finish</button>
  </div>
  <div class="pill" id="stepBar"><span id="sbLab">Step 1</span><u><b></b></u><em id="sbPct">0%</em><button id="btnSkip">Skip</button></div>
</div>

<div id="toast"></div>

<div class="ov on" id="shop">
  <header id="shopHead"><h1>Restoration <span>Workshop</span></h1><p id="shopSub">Pick any relic to bring back to life</p></header>
  <div id="grid"></div>
</div>
<div class="ov" id="intro">
  <div id="inTop"><button class="pill iconbtn" id="inBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div id="inTitle"><b id="inName"></b><span id="inMeta"></span></div></div>
  <div id="inBot"><p id="inDesc"></p><div id="inBtns"><button class="big" id="inStart">Start Restoring</button><button class="big ghost hide" id="inCont">Continue</button></div></div>
</div>
<div class="ov" id="done"><div class="card"><div class="stars">&#9733;&#9733;&#9733;</div><h1>Fully <span>Restored!</span></h1><p class="sub" id="doneSub"></p><div class="stats"><div class="stat"><b id="dSteps">0</b><span>Steps</span></div><div class="stat"><b id="dTime">0</b><span>Time</span></div></div><button class="big go" id="btnShop">Back to Workshop</button><button class="link" id="btnLook">Keep admiring it</button></div></div>
<div class="ov" id="menu"><div class="card"><h1 style="font-size:36px">Paused</h1><p class="sub" id="menuSub"></p><button class="big" id="mResume">Resume</button><div class="menuRow"><button class="big ghost" id="mSnd">Sound: on</button></div><div class="menuRow"><button class="big ghost" id="mAuto">Auto turn: on</button><button class="big ghost" id="mQ">Effects: high</button></div><button class="big ghost wide" id="mShop">Back to Workshop</button><button class="link" id="mRestart">Restart this object</button></div></div>
<div class="ov on" id="load"><div><h1>Restoration <span>Workshop</span></h1><u><b id="loadBar"></b></u><p id="loadTxt">Preparing the workshop…</p></div></div>
<div id="nogl">This game needs WebGL 2, which this browser or device does not support. Try a recent Chrome, Safari or Firefox.</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
